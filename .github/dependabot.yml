version: 2
updates:
  # npm 依赖更新
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    # 自动分组 PR（一次性合并多个更新）
    groups:
      astro:
        patterns:
          - "astro*"
          - "@astrojs/*"
      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "@types/*"
      linting:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
    # 忽略 major 更新（手动审查）
    ignore:
      - dependency-name: "astro"
        update-types: ["version-update:semver-major"]
      # typescript major 需要等 @astrojs/check 兼容：
      # @astrojs/check@0.9.10 peer 要求 typescript ^5.0.0 || ^6.0.0，
      # 升到 7.x 会触发 npm ERESOLVE
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
