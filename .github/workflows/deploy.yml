name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '20'
      DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET || 'github' }}
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_USER: ${{ github.repository_owner }}
      SITE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== Static Pages ==="
          find dist -name '*.html' | grep -v '_astro' | sort
          echo "=== Sitemap ==="
          head -3 dist/sitemap-0.xml
          echo "=== RSS ==="
          head -5 dist/rss.xml
          echo "=== Total Size ==="
          du -sh dist/

  deploy-github:
    if: ${{ env.DEPLOY_TARGET == 'github' || env.DEPLOY_TARGET == '' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cf:
    if: ${{ env.DEPLOY_TARGET == 'cf' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Upload to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_PAGES_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: ${{ vars.CF_PROJECT_NAME }}
          directory: dist
