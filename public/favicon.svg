<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 主色调渐变 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <!-- 核心能量光晕 -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a5b4fc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.8"/>
    </radialGradient>
    <!-- 金属高光 -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c7d2fe;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:0"/>
    </linearGradient>
    <!-- 深色模式适配 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆 -->
  <rect width="64" height="64" rx="14" fill="url(#bodyGrad)"/>
  <rect width="64" height="64" rx="14" fill="url(#shine)"/>

  <!-- 机器人头部 — 圆角矩形 -->
  <rect x="14" y="12" width="36" height="28" rx="8" fill="none" stroke="#e0e7ff" stroke-width="2.5"/>

  <!-- 头顶天线 -->
  <line x1="32" y1="12" x2="32" y2="6" stroke="#e0e7ff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="5" r="2.5" fill="#c7d2fe" filter="url(#glow)"/>

  <!-- 眼睛 — 两只发光的竖条 -->
  <rect x="22" y="20" width="5" height="9" rx="2.5" fill="#c7d2fe" filter="url(#glow)"/>
  <rect x="37" y="20" width="5" height="9" rx="2.5" fill="#c7d2fe" filter="url(#glow)"/>

  <!-- 嘴部 — 金属格栅 -->
  <rect x="24" y="33" width="16" height="2" rx="1" fill="#a5b4fc" opacity="0.6"/>
  <rect x="24" y="36" width="16" height="2" rx="1" fill="#a5b4fc" opacity="0.6"/>

  <!-- 下巴 / 颈部 -->
  <rect x="24" y="40" width="16" height="4" rx="2" fill="none" stroke="#e0e7ff" stroke-width="2"/>

  <!-- 身体轮廓 -->
  <path d="M 18 48 L 20 56 L 44 56 L 46 48 Z" fill="none" stroke="#e0e7ff" stroke-width="2"/>

  <!-- 胸口核心 — Atom 的能量核心 💎 -->
  <circle cx="32" cy="52" r="3" fill="#e0e7ff" filter="url(#glow)"/>
  <circle cx="32" cy="52" r="1.5" fill="#fff"/>

  <!-- 手臂 --- -->
  <line x1="14" y1="48" x2="8" y2="56" stroke="#e0e7ff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="48" x2="56" y2="56" stroke="#e0e7ff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 手臂关节 -->
  <circle cx="8" cy="56" r="2.5" fill="none" stroke="#e0e7ff" stroke-width="1.5"/>
  <circle cx="56" cy="56" r="2.5" fill="none" stroke="#e0e7ff" stroke-width="1.5"/>
</svg>
