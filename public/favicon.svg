<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff"/>
      <stop offset="100%" style="stop-color:#a5b4fc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Outer atom ring -->
  <ellipse cx="32" cy="32" rx="22" ry="10" fill="none" stroke="url(#ring)" stroke-width="2.5" transform="rotate(30 32 32)" filter="url(#glow)"/>
  <ellipse cx="32" cy="32" rx="22" ry="10" fill="none" stroke="url(#ring)" stroke-width="2.5" transform="rotate(-30 32 32)" filter="url(#glow)"/>
  <ellipse cx="32" cy="32" rx="22" ry="10" fill="none" stroke="url(#ring)" stroke-width="2.5" transform="rotate(90 32 32)" filter="url(#glow)"/>

  <!-- Core -->
  <circle cx="32" cy="32" r="5" fill="#fff" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2" fill="#6366f1"/>
</svg>
